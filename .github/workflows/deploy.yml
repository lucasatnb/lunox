name: Publicar no Cloudflare

# Toda vez que alguém der push na main, o Worker e os assets são publicados.
# Se preferir usar Workers Builds (dashboard), apague este arquivo para não
# publicar duas vezes.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-lunox
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar o Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publicar o Worker
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
